# Local development only. Credentials here are not used anywhere else.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: monster
      POSTGRES_PASSWORD: monster
      POSTGRES_DB: monstertheatre
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monster -d monstertheatre"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
